<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chordino manual review</title>
  <style>
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #1d2433; }
    label { display: block; margin: 1rem 0; font-weight: 650; }
    input { display: block; margin-top: .35rem; font: inherit; }
    audio { width: 100%; margin: 1rem 0; }
    .comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    output { display: block; min-height: 4.5rem; padding: 1rem; border-radius: .5rem; background: #eef2ff; font-size: 2rem; font-weight: 750; }
    output small { display: block; font-size: .875rem; font-weight: 500; }
    ol { max-height: 24rem; overflow: auto; padding-left: 2.5rem; }
    button { border: 0; background: none; color: #244bb8; font: inherit; cursor: pointer; }
    button[aria-current="true"] { color: #111827; font-weight: 750; }
  </style>
</head>
<body>
  <h1>Chordino manual review</h1>
  <p>Select one derived WAV plus its raw and candidate <code>.lab</code> files. Files stay in this browser and are not uploaded.</p>
  <label>Recording <input id="audio-file" type="file" accept="audio/wav"></label>
  <label>Raw Chordino labels <input id="raw-label-file" type="file" accept=".lab,text/plain"></label>
  <label>Musical-window candidate labels <input id="candidate-label-file" type="file" accept=".lab,text/plain"></label>
  <audio id="player" controls></audio>
  <div class="comparison">
    <section><h2>Raw</h2><output id="raw-current" aria-live="polite">Choose files</output><ol id="raw-cues"></ol></section>
    <section><h2>Candidate</h2><output id="candidate-current" aria-live="polite">Choose files</output><ol id="candidate-cues"></ol></section>
  </div>
  <script>
    const audioFile = document.querySelector("#audio-file");
    const player = document.querySelector("#player");
    const views = ["raw", "candidate"].map((id) => ({
      input: document.querySelector(`#${id}-label-file`),
      output: document.querySelector(`#${id}-current`),
      list: document.querySelector(`#${id}-cues`),
      cues: [],
      activeIndex: -1
    }));

    audioFile.addEventListener("change", () => {
      if (audioFile.files[0]) player.src = URL.createObjectURL(audioFile.files[0]);
    });

    for (const view of views) view.input.addEventListener("change", async () => {
      const text = await view.input.files[0]?.text();
      view.cues = String(text || "").trim().split("\n").filter(Boolean).map((line) => {
        const [start, end, label] = line.split("\t");
        return { start: Number(start), end: Number(end), label: label?.replace(/^"|"$/g, "") };
      }).filter((cue) => Number.isFinite(cue.start) && cue.end > cue.start && cue.label);
      view.list.replaceChildren(...view.cues.map((cue, index) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `${formatTime(cue.start)}  ${cue.label}`;
        button.addEventListener("click", () => { player.currentTime = cue.start; player.play(); });
        button.dataset.index = index;
        item.append(button);
        return item;
      }));
      view.activeIndex = -1;
      updateCue();
    });

    player.addEventListener("timeupdate", updateCue);
    player.addEventListener("seeked", updateCue);

    function updateCue() {
      for (const view of views) {
        const nextIndex = view.cues.findIndex((cue) => cue.start <= player.currentTime && cue.end > player.currentTime);
        if (nextIndex === view.activeIndex) continue;
        view.list.querySelector(`[data-index="${view.activeIndex}"]`)?.removeAttribute("aria-current");
        view.activeIndex = nextIndex;
        const cue = view.cues[view.activeIndex];
        view.output.replaceChildren(cue?.label || "No chord label at this time");
        if (cue) {
          const timing = document.createElement("small");
          timing.textContent = `${formatTime(cue.start)}–${formatTime(cue.end)}`;
          view.output.append(timing);
        }
        const button = view.list.querySelector(`[data-index="${view.activeIndex}"]`);
        button?.setAttribute("aria-current", "true");
        button?.scrollIntoView({ block: "nearest" });
      }
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      return `${minutes}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
    }
  </script>
</body>
</html>
