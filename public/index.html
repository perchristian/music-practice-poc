<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piano Practice POC</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Mock pipeline</p>
            <h1>Piano practice from a screen recording</h1>
          </div>
          <div class="status-pill" id="serviceStatus" data-testid="service-status">Checking backend</div>
        </header>

        <section class="panel upload-panel" aria-labelledby="uploadTitle">
          <div>
            <h2 id="uploadTitle">Upload recording</h2>
            <p class="muted">Choose a small video or audio file. Mock mode uses the file to exercise the real upload and job flow.</p>
          </div>
          <form id="uploadForm" class="upload-form">
            <label class="file-drop">
              <input id="mediaInput" data-testid="media-input" name="media" type="file" accept="video/*,audio/*" required>
              <span id="fileLabel" data-testid="file-label">Select screen recording</span>
            </label>
            <button type="submit" id="uploadButton" data-testid="upload-button">Upload and process</button>
          </form>
          <div class="job-progress" id="jobProgress" hidden>
            <div class="progress-copy">
              <span id="jobStatus" data-testid="job-status">Waiting</span>
              <span id="jobPercent" data-testid="job-percent">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>
        </section>

        <section class="practice-grid" id="practiceView" data-testid="practice-view" hidden>
          <section class="panel player-panel" aria-labelledby="playerTitle">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Processed result</p>
                <h2 id="playerTitle">Stem practice mix</h2>
              </div>
              <span class="time-readout" id="timeReadout">0:00 / 0:00</span>
            </div>

            <div id="stemDeck" class="stem-deck" aria-label="Processed stems"></div>

            <div class="transport">
              <button type="button" id="playButton" class="play-button">Play</button>
              <input id="scrubber" type="range" min="0" max="16" step="0.1" value="0" aria-label="Playback position">
            </div>

            <div>
              <div class="control-row stem-heading">
                <span class="control-label">Stems</span>
              </div>
              <div id="stemMixer" class="stem-mixer" aria-label="Stem controls"></div>
            </div>

            <div class="control-row">
              <span class="control-label">Speed</span>
              <div class="segmented" id="speedControls" role="group" aria-label="Playback speed">
                <button type="button" data-speed="0.5" data-testid="speed-05">0.5x</button>
                <button type="button" data-speed="0.75" data-testid="speed-075">0.75x</button>
                <button type="button" data-speed="1" data-testid="speed-1" class="active">1x</button>
                <button type="button" data-speed="1.25" data-testid="speed-125">1.25x</button>
              </div>
            </div>

            <div class="loop-grid">
              <label>
                <span>Loop start</span>
                <input id="loopStart" data-testid="loop-start" type="number" min="0" step="0.1" value="0">
              </label>
              <label>
                <span>Loop end</span>
                <input id="loopEnd" data-testid="loop-end" type="number" min="0" step="0.1" value="4">
              </label>
              <label class="toggle">
                <input id="loopEnabled" data-testid="loop-enabled" type="checkbox">
                <span>Loop</span>
              </label>
            </div>
          </section>

          <section class="panel harmony-panel" aria-labelledby="harmonyTitle">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Learning cues</p>
                <h2 id="harmonyTitle">Harmony</h2>
              </div>
              <div class="key-badge" id="keyBadge" data-testid="key-badge">Key</div>
            </div>
            <div class="chord-list" id="chordList"></div>
          </section>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
